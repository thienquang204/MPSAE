# docker compose run --rm mpsae run
# docker compose run --rm mpsae status
# docker compose run --rm mpsae --smoke run
#
# Credentials come from .env (HF_TOKEN, optionally HF_EMBEDDINGS_REPO and
# WANDB_*). The workspace is bind-mounted so ImageNet, the embeddings and the
# checkpoints survive the container and a restart resumes instead of restarting.
services:
  mpsae:
    build:
      context: .
      args:
        # 12.4.1 is enough for H100/Ada; 12.8.0 is required for Blackwell.
        CUDA_TAG: "12.8.0"
        TORCH_INDEX: "https://download.pytorch.org/whl/cu128"
    image: mpsae:latest
    env_file: [.env]
    environment:
      MPSAE_WORKSPACE: /work
      HF_HOME: /work/hf
    volumes:
      - ./work:/work
    # ImageNet decoding is CPU-bound; /dev/shm defaults to 64 MB, which stalls
    # the dataloaders long before the GPU is busy.
    shm_size: "16gb"
    ipc: host
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
