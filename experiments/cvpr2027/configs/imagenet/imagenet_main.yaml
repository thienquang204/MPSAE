description: 'Table 1 and Figure 2: 222 1-NN evaluations; Tables 12/13: 84 linear
  probes.'
runner: imagenet
base:
  name: cvpr2027-main
  backbones:
  - ff2048
  - vit_b16
  - convnext_tiny
  - dinov2_vits14
  methods:
  - csr
  - csrv2
  - mpsae
  seeds:
  - 1227
  imagenet:
    enabled: true
    prepare: false
    train_k:
      ff2048:
      - 8
      - 16
      - 32
      - 256
      vit_b16:
      - 12
      - 48
      - 192
      convnext_tiny:
      - 12
      - 48
      - 192
      dinov2_vits14:
      - 12
      - 48
      - 192
    eval_k:
      ff2048:
      - 2
      - 8
      - 16
      - 32
      - 256
      vit_b16:
      - 3
      - 12
      - 48
      - 96
      - 192
      - 384
      convnext_tiny:
      - 3
      - 12
      - 48
      - 96
      - 192
      - 384
      dinov2_vits14:
      - 3
      - 12
      - 48
      - 96
      - 192
      - 384
    e1: true
    e2: true
    linear_probe: true
    timing: false
    probe_k:
      ff2048:
      - 2
      - 16
      - 32
      - 256
      vit_b16:
      - 3
      - 48
      - 96
      - 384
      convnext_tiny: []
      dinov2_vits14: []
    timing_query_batch: 512
    timing_warmup: 5
    timing_rounds: 5
    timing_gallery_chunk: 32768
    timing_build_entry_cap: 4194304
    timing_retry_skipped: false
  downstream:
    enabled: false
    datasets:
    - sop
    train_k: null
    eval_k: null
    mode: frozen
    revisions: {}
    backbones: {}
    tasks: {}
    knn:
      n_neighbors:
      - 1
      - 20
      temperature: 0.07
  execution:
    train_missing: true
    continue_on_error: false
    retain_codes: false
    max_steps: 0
    storage_mode: direct_v1
    cleanup_raw: false
    precomputed_only: true
    train_log_every: 10
    checkpoint_every: 100
    feature_residency: auto
