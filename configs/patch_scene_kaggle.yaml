# Cityscapes fine train/validation only. Full patches, no patch subsampling for SAE.
# 18 fits; 54 sparse evaluations + 2 measured dense references = 56 conditions.
seed: 1227
datasets: [cityscapes]
encoders: [siglip2, dinov2]
k: 12
train_k: [3, 12, 48]
inference_k: [3, 12, 48]
image_size: 448
image_width: 896
all_train_patches: true
# Legacy sampled-bank field; ignored for full-patch training and support sampling.
train_patches: 0
support_patches: 65536
hidden_dim: 8192
epochs: 10
batch_size: 1024
lr: 0.00004
early_stopping: false
extraction_batch: 1
workers: 2
shard_images: 32
query_block: 16
neighbors: 30
temperature: 0.02
checkpoint_every: 128
log_every: 20
cache_dtype: float16
