# Run with --smoke: synthetic rehearsal in an automatically isolated workspace.
name: smoke
backbones: [rn18]
methods: [csr, mpsae]
seeds: [1227]
imagenet:
  enabled: true
  train_k: [8]
  e1: true
  e2: false
  linear_probe: true
  timing: false
downstream:
  datasets: [eurosat, flowers102, sop]
  train_k: [8]
  eval_k: [2, 8, 32]
  mode: frozen
execution:
  max_steps: 2
  retain_codes: false
