# Supported VOC patch-SAE benchmark; preserved prior numerical settings.
# 18 fits, 54 sparse + 2 dense evaluations. Cross-K sweep retained for VOC.
datasets: [voc]
seed: 1227
k: 12  # Legacy default; train_k below selects the actual independent fits.
train_k: [3, 12, 48]
encoders: [siglip2, dinov2]
inference_k: [3, 12, 48]
hidden_dim: 8192
image_size: 448
train_patches: 262144
support_patches: 65536
epochs: 10
batch_size: 1024
lr: 0.00004
extraction_batch: 4
workers: 2
shard_images: 64
query_block: 32
neighbors: 30
temperature: 0.02
checkpoint_every: 128
log_every: 20
cache_dtype: float16
